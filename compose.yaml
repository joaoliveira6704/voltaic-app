services:
  # API
  api:
    build: "./api"
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://root:example@mongodb:27017/voltaic-db?authSource=admin
    env_file:
      - ./api/.env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  # Mongo Database
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pythongen:
    build:
      context: ./data-gen
    environment:
      MONGO_URI: mongodb://root:example@mongodb:27017/voltaic-db?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
