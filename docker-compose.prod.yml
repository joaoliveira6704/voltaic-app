services:
  redis:
    image: redis:7-alpine
    container_name: voltaic-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - voltaic-net

  api:
    build:
      context: ./api
      target: production
    container_name: voltaic-api
    restart: unless-stopped
    expose:
      - "3000"
    env_file: ./api/.env
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - voltaic-net

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: voltaic-frontend
    restart: unless-stopped
    expose:
      - "5173"
    environment:
      NUXT_PUBLIC_API_BASE_URL: ""
      NUXT_API_BASE_URL: "http://api:3000"
    networks:
      - voltaic-net
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: voltaic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/voltaic:/etc/ssl/voltaic:ro
    networks:
      - voltaic-net
    depends_on:
      - api
      - frontend

volumes:
  redis_data:

networks:
  voltaic-net:
    driver: bridge
